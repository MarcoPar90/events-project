spring.application.name=booking

server.port=8081

application.url=http://localhost:8081
application.users.url=http://localhost:8082/api/v1/users
application.events.url=http://localhost:8080/v1/api/events

// to use file env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/booking_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.header=Authorization
jwt.secret=${JWT_SECRET_KEY}