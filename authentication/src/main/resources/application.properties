server.port=8082

application.url=http://localhost:8082

spring.application.name=authentication

// to use file env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/auth?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

token.signing.key=${JWT_SECRET_KEY}

token.expiration.milliseconds=${JWT_TOKEN_EXPIRATION}
token.signing.refresh-key=${JWT_SECRET_REFRESH_KEY}
token.expiration.refresh-milliseconds=${JWT_REFRESH_TOKEN_EXPIRATION}